[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coroutines = "1.10.2"
lifecycle = "2.9.4"
annotation = "1.9.1"
compose-runtime = "1.8.3"
junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
json-schema-validator = "1.5.9"

[libraries]
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-runtime" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-runtime" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-runtime" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-runtime" }
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Maven Central (Central Portal) with signing, sources and javadoc jars, and the full POM it requires.
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.34.0" }
# Gradle Plugin Portal, for `com.tapll`.
plugin-publish = { id = "com.gradle.plugin-publish", version = "1.3.1" }
