org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# One place for the SDK version: BuildConfig.SDK_VERSION, the User-Agent, device.sdk_version and the
# Maven coordinates all read it.
VERSION_NAME=0.2.0
GROUP=com.tapll

# POM fields Maven Central requires, shared by every published artifact (read by
# com.vanniktech.maven.publish; each module sets POM_ARTIFACT_ID, POM_NAME and POM_DESCRIPTION).
POM_URL=https://tapll.com
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/tapll/tapll-android
POM_SCM_CONNECTION=scm:git:https://github.com/tapll/tapll-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/tapll/tapll-android.git
POM_DEVELOPER_ID=tapll
POM_DEVELOPER_NAME=Tapll
POM_DEVELOPER_URL=https://tapll.com
